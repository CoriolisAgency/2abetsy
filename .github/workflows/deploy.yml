name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project site URL until custom domain DNS is ready:
      #   https://coriolisagency.github.io/2abetsy/
      # When 2abetsy.com is verified on Pages, change to:
      #   ASTRO_BASE: /
      #   ASTRO_SITE: https://2abetsy.com
      - run: npm run build
        env:
          ASTRO_BASE: /2abetsy/
          ASTRO_SITE: https://coriolisagency.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
