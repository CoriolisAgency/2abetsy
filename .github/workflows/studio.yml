# Reporting only. Never merge. Never write to repos.
# Posts a CodeFab sprint-row event only (Coding / Verification / Shipped).
# The reusable workflow inlines the reporter; no private botopticon checkout.
name: Studio
on:
  pull_request:
    types: [opened, ready_for_review, reopened, closed]
  push:
permissions:
  contents: read
  pull-requests: read
jobs:
  report:
    uses: CoriolisAgency/botopticon/.github/workflows/studio-report.yml@main
    with:
      source: coriolis
    secrets:
      BOTOPTICON_TOKEN: ${{ secrets.BOTOPTICON_TOKEN }}
